<script>
const $=id=>document.getElementById(id),root=document.documentElement;
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const bd=n=>`<span class="b" style="background:linear-gradient(135deg,${col(n)},#000 190%)">${E((n[0]||'?').toUpperCase())}${L[n]?`<img src="${E(L[n])}" alt="" onerror="this.remove()">`:''}</span>`;
const ini=n=>n.split(' ').map(w=>w[0]).join('').slice(0,2);
const empty=t=>`<div class="empty">${t}</div>`;
const cmpT=(a,b)=>{const x=/^\d+$/.test(a),y=/^\d+$/.test(b);return x&&y?a-b:x?-1:y?1:0};
const cmpM=(a,b)=>(a[1]+a[2]).localeCompare(b[1]+b[2])||cmpT(a[0],b[0]);
const kind=(f,c)=>f>c?'W':f<c?'L':'D',kl=(f,c)=>f>c?'В':f<c?'П':'Н';

function design(z){if(!z)return;const s=root.style;z.accent&&s.setProperty('--ac',z.accent);z.bg&&s.setProperty('--c1',z.bg);z.text&&s.setProperty('--c2',z.text)}
function league(g){const n=g['Название']||'Лига',b=g['Бренд']||n,u=g['Логотип'];document.title=b+' · '+n;$('brand').textContent=b;$('h1').textContent=n;$('sea').textContent=g['Сезон']||'';$('desc').textContent=g['Описание']||'';$('hb').textContent=b;
 for(const id of['lg','hlg']){const i=$(id);i.hidden=!u;if(u){i.onerror=()=>{i.hidden=true;$('hb').hidden=false};i.src=u}}$('hb').hidden=!!u}

function count(el){const to=+el.dataset.to,dec=+el.dataset.d||0,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1500);el.textContent=(to*(1-Math.pow(1-k,4))).toFixed(dec);if(k<1)requestAnimationFrame(f)})(t0)}
function reveal(){const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.1});document.querySelectorAll('.rv:not(.in)').forEach(el=>io.observe(el))}

/* ---------- таблица ---------- */
const RES=()=>{const R={};[...M.filter(isLg)].sort(cmpM).forEach(r=>{(R[r[3]]=R[r[3]]||[]).push([r[4],r[5],r[6]]);(R[r[6]]=R[r[6]]||[]).push([r[5],r[4],r[3]])});return R};
function views(){const R=RES();return[
()=>`<div class="r h"><div>М</div><div>Команда</div><div>И</div><div>В</div><div>Н</div><div>П</div><div>ГЗ</div><div>ГП</div><div>+/-</div><div>О</div><div>Форма</div></div>`+S.map((x,i)=>`<div class="r rv ${i==0?'z1':i==1?'z2':''}" data-team="${E(x.team)}" style="--i:${i}"><div class="p">${i+1}</div><div class="t">${bd(x.team)}<span>${E(x.team)}</span></div><div>${x.p}</div><div>${x.w}</div><div>${x.d}</div><div>${x.l}</div><div>${x.gf}</div><div>${x.ga}</div><div>${x.gf-x.ga>0?'+':''}${x.gf-x.ga}</div><div class="pt">${x.pts}</div><div class="f">${[...(x.form||'').slice(-5)].map(c=>`<i class="${{'В':'W','Н':'D','П':'L'}[c]}"></i>`).join('')}</div></div>`).join(''),
()=>`<div class="cw"><table class="cx"><tr><th></th>${S.map(x=>`<th>${bd(x.team)}</th>`).join('')}</tr>${S.map(a=>`<tr><th class="l" data-team="${E(a.team)}"><div>${bd(a.team)}<span>${E(a.team)}</span></div></th>${S.map(b=>{if(a.team==b.team)return'<td class="x"></td>';const m=M.filter(r=>isLg(r)&&((r[3]==a.team&&r[6]==b.team)||(r[3]==b.team&&r[6]==a.team)));return'<td>'+(m.length?m.map(r=>{const h=r[3]==a.team,f=h?r[4]:r[5],c=h?r[5]:r[4];return`<b class="${kind(f,c)}t">${f}:${c}</b>`}).join('<br>'):'<span class="no">–</span>')+'</td>'}).join('')}</tr>`).join('')}</table></div>`,
()=>S.map((x,i)=>`<div class="pg rv" data-team="${E(x.team)}" style="--i:${i}"><div class="p">${i+1}</div>${bd(x.team)}<div class="pn"><b>${E(x.team)}</b><div class="bar"><i style="--w:${x.pts/Math.max(1,x.p*3)*100}%"></i></div><small>${x.pts} из ${x.p*3} очков</small></div><div class="cs">${(R[x.team]||[]).map(([f,c,o])=>`<i class="${kind(f,c)}" title="${E(o)} ${f}:${c}">${kl(f,c)}</i>`).join('')}</div></div>`).join('')]}
function paintT(){const v=views();$('tt').innerHTML=['Таблица','Шахматка','Прогресс'].map((t,i)=>`<button class="${i==tv?'on':''}" data-i="${i}">${t}</button>`).join('');
 $('tbl').innerHTML=S.length?v[tv]():empty('Добавьте команды на листе «Команды»');document.querySelectorAll('#tt button').forEach(b=>b.onclick=()=>{tv=+b.dataset.i;paintT();reveal()})}

/* ---------- игры ---------- */
function mcard(r,i){const p=played(r),pen=r[7]===true&&p&&r[8]!==''&&r[9]!=='',d=r[4]==r[5],
 hw=p&&(r[4]>r[5]||(d&&pen&&r[8]>r[9])),aw=p&&(r[5]>r[4]||(d&&pen&&r[9]>r[8]));
 return`<div class="m rv ${p?'':'u'}" style="--i:${i}"><div class="mt">${E(r[2]||'—')}</div><div class="z ${hw?'w':''}">${bd(r[3])}${E(r[3])}</div><div class="s d">${p?r[4]+' : '+r[5]:'—'}${pen?`<small>пен. ${r[8]} : ${r[9]}</small>`:''}</div><div class="a ${aw?'w':''}">${E(r[6])}${bd(r[6])}</div></div>`}
function paintG(){const chips=tours.map(t=>`<button class="${t==cur?'on':''}" data-t="${E(t)}">${E(tl(t))}</button>`).join('');
 $('tours').innerHTML=chips;$('hc').innerHTML=chips;
 $('hm').innerHTML=D.matches.filter(r=>r[0]==cur).sort(cmpM).map((r,i)=>{const p=played(r);return`<div class="mi" style="animation-delay:${i*50}ms"><span style="text-align:right">${E(r[3])}</span><b class="d">${p?r[4]+':'+r[5]:E(r[2]||'—')}</b><span>${E(r[6])}</span></div>`}).join('')||'<span class="no">Нет матчей</span>';
 const g={};D.matches.filter(r=>r[0]==cur).forEach(r=>(g[r[1]]=g[r[1]]||[]).push(r));
 $('ml').innerHTML=tours.length?Object.keys(g).sort().reverse().map(k=>`<div class="day rv">${k?new Date(k+'T12:00').toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long'}):'Дата уточняется'}</div>`+g[k].sort(cmpM).map(mcard).join('')).join(''):empty('Матчи появятся после заполнения листа «Матчи»');
 document.querySelectorAll('#tours button,#hc button').forEach(b=>b.onclick=()=>{cur=b.dataset.t;paintG();reveal()})}

/* ---------- статистика ---------- */
const avg=(v,g)=>g?+(v/g).toFixed(2):0;
const card=(i,media,name,st,cls='',tm='')=>`<div class="cd ${cls} rv" ${tm} style="--i:${i%5}"><em class="d">${i+1}</em>${media}<div class="nm">${E(name)}</div><div class="st">${st.map(([l,v])=>`<div><small>${l}</small><b class="d">${v}</b></div>`).join('')}</div></div>`;
const pl=x=>`<div class="ph">${x.ph?`<img src="${E(x.ph)}" alt="" onerror="this.remove()">`:E(ini(x.n))}<div class="tl">${bd(x.t)}</div></div>`;
const pc=(key,st)=>P.filter(x=>key(x)>0).sort((a,b)=>key(b)-key(a)||a.gm-b.gm).slice(0,15).map((x,i)=>card(i,pl(x),x.n,st(x))).join('');
function svs(){return[['Бомбардиры',()=>pc(x=>x.g,x=>[['И',x.gm],['Г (Пн.)',x.pen?`${x.g} (${x.pen})`:x.g],['Ср.',avg(x.g,x.gm)]])],
['Ассистенты',()=>pc(x=>x.a,x=>[['И',x.gm],['Пр',x.a],['Ср.',avg(x.a,x.gm)]])],
['Гол + Пас',()=>pc(x=>x.g+x.a,x=>[['И',x.gm],['Г+П',x.g+x.a],['Г',x.g],['Пр',x.a]])],
['Предупреждения',()=>pc(x=>x.yc+x.rc*2,x=>[['И',x.gm],['ЖК',x.yc],['КК',x.rc]])],
['Команды',()=>S.map((x,i)=>{const sum=k=>P.filter(p=>p.t==x.team).reduce((a,p)=>a+p[k],0),cs=M.filter(r=>isLg(r)&&((r[3]==x.team&&r[5]==0)||(r[6]==x.team&&r[4]==0))).length;
 return card(i,`<div class="ph big">${bd(x.team)}</div>`,x.team,[['И',x.p],['В',x.w],['Н',x.d],['П',x.l],['МЗ',x.gf],['МП',x.ga],['ЖК',sum('yc')],['КК',sum('rc')],["'0'",cs]],'t',`data-team="${E(x.team)}"`)}).join('')]]}
function paintS(){const v=svs();$('st').innerHTML=v.map((t,i)=>`<button class="${i==sv?'on':''}" data-i="${i}">${t[0]}</button>`).join('');
 $('sc').innerHTML=v[sv][1]()||empty('Пока нет данных — статистика считается из листов команд');document.querySelectorAll('#st button').forEach(b=>b.onclick=()=>{sv=+b.dataset.i;paintS();reveal()})}

/* ---------- карточка команды ---------- */
const ru=n=>n%10==1&&n%100!=11?'год':[2,3,4].includes(n%10)&&![12,13,14].includes(n%100)?'года':'лет';
function closeT(){$('sheet').classList.remove('on');document.body.style.overflow=''}
function openTeam(n,ev){const R=[...(RS[n]||[])].sort((a,b)=>a.n.localeCompare(b.n)),ag=R.map(x=>x.age).filter(a=>a!=='');
 const av=ag.length?(ag.reduce((a,b)=>a+b,0)/ag.length).toFixed(1):'—',pos=S.findIndex(x=>x.team==n)+1,st=S[pos-1]||{pts:0},s=$('sheet');
 s.style.setProperty('--cx',(ev?ev.clientX:innerWidth/2)+'px');s.style.setProperty('--cy',(ev?ev.clientY:innerHeight/2)+'px');s.style.setProperty('--tc',col(n));
 s.innerHTML=`<button class="x" id="tx" aria-label="Закрыть">✕</button><div class="th"><div class="bg">${bd(n)}</div><div><h3 class="d">${E(n)}</h3><div class="ts">${pos?pos+'-е место · '+st.pts+' очк.':''}</div></div><div class="tk2"><div><b class="d">${R.length}</b>игроков в заявке</div><div><b class="d">${av}</b>средний возраст</div></div></div><div class="tmb"><div class="tr h"><div>№</div><div>Амплуа</div><div>Игрок</div><div>Дата рождения</div><div>И</div><div>Г</div><div>Пр</div><div class="yc"></div><div class="rc"></div></div>${R.map((x,i)=>`<div class="tr" style="--i:${i}"><div>${E(x.num)}</div><div>${E(x.pos)}</div><div class="pn2"><span class="av">${x.ph?`<img src="${E(x.ph)}" alt="" onerror="this.remove()">`:E(ini(x.n))}</span><span>${E(x.n)}</span></div><div>${x.dob?new Date(x.dob).toLocaleDateString('ru')+', '+x.age+' '+ru(x.age):x.age!==''?x.age+' '+ru(x.age):'—'}</div><div>${x.gm||'-'}</div><div>${x.g}</div><div>${x.a}</div><div>${x.yc}</div><div>${x.rc}</div></div>`).join('')||empty('Заявка пока пуста — заполните лист команды')}</div>`;
 s.scrollTop=0;s.classList.add('on');document.body.style.overflow='hidden';$('tx').onclick=closeT}

/* ---------- сборка ---------- */
function main(d){D=d;Object.keys(C).forEach(k=>delete C[k]);Object.keys(L).forEach(k=>delete L[k]);
 (d.teams||[]).forEach(t=>{if(t.c)C[t.n]=t.c;if(t.l)L[t.n]=t.l});
 design(d.design);league(d.league||{});S=d.standings||[];M=d.matches.filter(played);RS=d.rosters||{};P=d.scorers||[];
 const goals=M.reduce((a,r)=>a+r[4]+r[5],0);
 $('kpi').innerHTML=[[(d.teams||[]).length,0,'команд'],[M.length,0,'матчей'],[goals,0,'голов'],[M.length?goals/M.length:0,1,'за матч']].map(k=>`<div class="d"><b data-to="${k[0]}" data-d="${k[1]}">0</b><span>${k[2]}</span></div>`).join('');
 setTimeout(()=>document.querySelectorAll('[data-to]').forEach(count),250);
 tours=[...new Set(d.matches.map(r=>r[0]))].sort(cmpT);
 if(!tours.includes(cur))cur=[...M].sort(cmpM).map(r=>r[0]).pop()||tours[0]||null;
 paintT();paintG();paintS();
 $('dq').innerHTML=d.disq.length?d.disq.map((x,i)=>`<div class="dq rv" style="--i:${i}"><b>${E(x.n)}</b><em>${E(x.s)}/${E(x.tot)}</em><span>${E(x.t)} · ${E(x.r)}<br>${E(x.from)} — ${E(x.to)}</span></div>`).join(''):empty('Действующих дисквалификаций нет');
 $('foot').textContent='Обновлено: '+new Date(d.updated||Date.now()).toLocaleString('ru');reveal()}

/* ---------- данные и мгновенное обновление ---------- */
let last='';
function upd(d){ver=d.v||ver;const k=JSON.stringify({...d,updated:0,v:0});if(k===last)return;last=k;main(d)}
function fail(){if(!D)document.body.insertAdjacentHTML('beforeend','<div class="err" id="er">Не удалось загрузить данные.<br><button onclick="location.reload()">Повторить</button></div>')}
/* Данные приходят из веб-приложения Apps Script. Последний ответ хранится в браузере: при повторном заходе сайт рисуется мгновенно, свежие данные подтягиваются следом. */
const API=window.API_URL,CK='mlfl:last',POLL=20000;
const store={get(){try{return localStorage.getItem(CK)}catch(e){return null}},set(v){try{localStorage.setItem(CK,v)}catch(e){}}};
async function req(q){const r=await fetch(API+'?api='+q,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return q==='v'?(await r.text()).trim():r.json()}
async function loadAll(){try{const d=await req(1);upd(d);store.set(JSON.stringify(d))}catch(e){fail()}}
async function pull(){if(document.hidden||!API)return;try{const v=await req('v');if(v&&v!==ver)await loadAll()}catch(e){}}
if(!API||/^ВСТАВЬТЕ/.test(API)){document.body.insertAdjacentHTML('beforeend','<div class="err">Укажите адрес веб-приложения Apps Script в начале index.html (window.API_URL).</div>')}
else{const c=store.get();if(c){try{upd(JSON.parse(c))}catch(e){}}loadAll();setInterval(pull,POLL);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});addEventListener('online',pull)}

/* ---------- интерактив ---------- */
document.onclick=e=>{const g=e.target.closest('[data-go]');if(g){$(g.dataset.go).scrollIntoView({behavior:'smooth'});return}const t=e.target.closest('[data-team]');if(t)openTeam(t.dataset.team,e)};
onkeydown=e=>e.key=='Escape'&&closeT();
$('sc').addEventListener('pointermove',e=>{const c=e.target.closest('.cd');if(!c)return;const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;c.style.setProperty('--mx',x+'px');c.style.setProperty('--my',y+'px');c.style.setProperty('--px',((x/r.width-.5)*-10)+'px');c.style.setProperty('--py',((y/r.height-.5)*-10)+'px')});
$('sc').addEventListener('pointerout',e=>{const c=e.target.closest('.cd');if(c){c.style.setProperty('--px','0px');c.style.setProperty('--py','0px')}});
try{const s=localStorage.getItem('th');if(s)root.dataset.theme=s}catch(e){}
$('th').onclick=()=>{const n=root.dataset.theme=='light'?'dark':'light';root.dataset.theme=n;try{localStorage.setItem('th',n)}catch(e){}};
/* логотип статичен; раз в несколько секунд по нему пробегает блик (рисуется только по форме логотипа) */
(()=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const img=$('hlg'),cv=$('hlc'),ctx=cv.getContext('2d');
 function glint(){if(document.hidden||img.hidden||!img.complete||!img.naturalWidth||img.getBoundingClientRect().bottom<0)return;
  const dpr=devicePixelRatio||1,w=img.clientWidth,h=img.clientHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const k=Math.min(w/img.naturalWidth,h/img.naturalHeight),dw=img.naturalWidth*k,dh=img.naturalHeight*k,dx=(w-dw)/2,dy=(h-dh)/2,t0=performance.now();
  (function f(t){const q=Math.min(1,(t-t0)/1100),p=-.25+1.5*(q<.5?2*q*q:1-Math.pow(-2*q+2,2)/2);
   ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,w,h);ctx.drawImage(img,dx,dy,dw,dh);
   ctx.globalCompositeOperation='source-in';const g=ctx.createLinearGradient(w*(p-.16),0,w*(p+.16),h*.45);
   g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.85)');g.addColorStop(1,'rgba(255,255,255,0)');
   ctx.fillStyle=g;ctx.fillRect(0,0,w,h);if(q<1)requestAnimationFrame(f);else ctx.clearRect(0,0,w,h)})(t0)}
 setTimeout(function loop(){glint();setTimeout(loop,5500)},1500);
})();
/* цвет акцента плавно следует за курсором на фоне сайта */
(()=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const g=$('cur');let x=0,y=0,tx=0,ty=0,run=false;
 function f(){x+=(tx-x)*.12;y+=(ty-y)*.12;g.style.setProperty('--gx',x+'px');g.style.setProperty('--gy',y+'px');
  if(Math.abs(tx-x)+Math.abs(ty-y)>.5)requestAnimationFrame(f);else run=false}
 addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;if(!g.classList.contains('on')){x=tx;y=ty;g.classList.add('on')}if(!run){run=true;requestAnimationFrame(f)}},{passive:true});
 document.documentElement.addEventListener('pointerleave',()=>g.classList.remove('on'));
})();
const ht=$('ht'),hl=$('hl'),hero=document.querySelector('.hero');
addEventListener('scroll',()=>{const h=innerHeight*.8;if(scrollY>innerHeight*1.2)return;const p=Math.min(1,Math.max(0,scrollY/h));ht.style.transform=`translateY(${-p*30}px)`;ht.style.opacity=1-Math.max(0,(p-.55)*2.4)},{passive:true});
</script></body></html>
