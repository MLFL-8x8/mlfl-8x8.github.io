()=>blocks(rows=>`<div class="cw"><table class="cx"><tr><th></th>${rows.map(x=>`<th>${bd(x.team)}</th>`).join('')}</tr>${rows.map(a=>`<tr><th class="l" data-team="${E(a.team)}"><div>${bd(a.team)}<span>${E(a.team)}</span></div></th>${rows.map(b=>{if(a.team==b.team)return'<td class="x"></td>';const m=MP.filter(r=>((r[3]==a.team&&r[6]==b.team)||(r[3]==b.team&&r[6]==a.team)));return'<td>'+(m.length?m.map(r=>{const h=r[3]==a.team,f=h?r[4]:r[5],c=h?r[5]:r[4];return`<b class="${kind(f,c)}t">${f}:${c}</b>`}).join('<br>'):'<span class="no">–</span>')+'</td>'}).join('')}</tr>`).join('')}</table></div>`),
()=>blocks(rows=>rows.map((x,i)=>`<div class="pg rv" data-team="${E(x.team)}" style="--i:${i}"><div class="p">${i+1}</div>${bd(x.team)}<div class="pn"><b>${E(x.team)}</b><div class="bar"><i style="--w:${x.pts/Math.max(1,x.p*3)*100}%"></i></div><small>${x.pts} из ${x.p*3} очков</small></div><div class="cs">${(R[x.team]||[]).map(([f,c,o])=>`<i class="${kind(f,c)}" title="${E(o)} ${f}:${c}">${kl(f,c)}</i>`).join('')}</div></div>`).join(''))]}

 return`<div class="bm" data-mi="${D.matches.indexOf(r)}">${row(r[3],r[4],x.hw,x.aw,r[8])}${row(r[6],r[5],x.aw,x.hw,r[9])}</div>`}

 return`<div class="bk">${tours.map(t=>{const a=MS.filter(r=>r[0]===t).sort(cmpM);return`<div class="rd"><h4>${E(tl(t))}</h4><div class="rm">${a.length?a.map(bm).join(''):'<div class="bm none">Пары ещё не определены</div>'}</div></div>`}).join('')}</div>`}

const pc=(key,st)=>P.filter(x=>key(x)>0).sort((a,b)=>key(b)-key(a)||a.gm-b.gm).slice(0,15).map((x,i)=>card(i,pl(x),x.n,st(x))).join('');

['Предупреждения',()=>pc(x=>x.yc+x.rc*2,x=>[['И',x.gm],['ЖК',x.yc],['КК',x.rc]])],
['Команды',()=>(ST&&ST.t==='g'&&S.length?S:DR).map((x,i)=>{const sum=k=>P.filter(p=>p.t==x.team).reduce((a,p)=>a+p[k],0),cs=M.filter(r=>(r[3]==x.team&&r[5]==0)||(r[6]==x.team&&r[4]==0)).length;
 return card(i,`<div class="ph big">${bd(x.team)}</div>`,x.team,[['И',x.p],['В',x.w],['Н',x.d],['П',x.l],['МЗ',x.gf],['МП',x.ga],['ЖК',sum('yc')],['КК',sum('rc')],["'0'",cs]],'t',`data-team="${E(x.team)}"`)}).join('')],
['Дисквалификации',()=>D.disq.filter(x=>!(x.t in TD)||TD[x.t]===div).map((x,i)=>`<div class="dq rv" style="--i:${i}"><b>${E(x.n)}</b><em>${E(x.s)}/${E(x.tot)}</em><span>${E(x.t)} · ${E(x.r)}<br>${E(x.from)} — ${E(x.to)}</span></div>`).join('')||empty('Действующих дисквалификаций нет'),'dql']]}
function paintS(){const v=svs();if(sv>=v.length)sv=0;$('st').innerHTML=v.map((t,i)=>`<button class="${i==sv?'on':''}" data-i="${i}">${t[0]}</button>`).join('');
 $('sc').className=v[sv][2]||'cards';
 $('sc').innerHTML=v[sv][1]()||empty('Пока нет данных — статистика считается из листов команд');document.querySelectorAll('#st button').forEach(b=>b.onclick=()=>{sv=+b.dataset.i;paintS();reveal()})}

 s.style.setProperty('--cx',(ev&&ev.clientX?ev.clientX:innerWidth/2)+'px');s.style.setProperty('--cy',(ev&&ev.clientY?ev.clientY:innerHeight/2)+'px');

function openTeam(n,ev){const R=[...(RS[n]||[])].sort((a,b)=>a.n.localeCompare(b.n)),ag=R.map(x=>x.age).filter(a=>a!=='');
 const av=ag.length?(ag.reduce((a,b)=>a+b,0)/ag.length).toFixed(1):'—',tb=Tb.find(b=>b.rows.some(x=>x.team==n))||D.tables.find(b=>b.rows.some(x=>x.team==n)),pos=tb?tb.rows.findIndex(x=>x.team==n)+1:0,st=tb?tb.rows[pos-1]:{pts:0};
 showSheet(X+`<div class="th"><div class="bg">${bd(n)}</div><div><h3 class="d">${E(n)}</h3><div class="ts">${pos?pos+'-е место · '+st.pts+' очк.'+(tb.g?' · группа '+E(tb.g):''):''}</div></div><div class="tk2"><div><b class="d">${R.length}</b>игроков в заявке</div><div><b class="d">${av}</b>средний возраст</div></div></div><div class="tmb"><div class="tr h"><div>№</div><div>Амплуа</div><div>Игрок</div><div>Дата рождения</div><div>И</div><div>Г</div><div>Пр</div><div class="yc"></div><div class="rc"></div></div>${R.map((x,i)=>`<div class="tr" style="--i:${i}"><div>${E(x.num)}</div><div>${E(x.pos)}</div><div class="pn2"><span class="av">${x.ph?`<img src="${E(x.ph)}" alt="" onerror="this.remove()">`:E(ini(x.n))}</span><span>${E(x.n)}</span></div><div>${x.dob?new Date(x.dob).toLocaleDateString('ru')+', '+x.age+' '+ru(x.age):x.age!==''?x.age+' '+ru(x.age):'—'}</div><div>${x.gm||'-'}</div><div>${x.g}</div><div>${x.a}</div><div>${x.yc}</div><div>${x.rc}</div></div>`).join('')||empty('Заявка пока пуста — заполните лист команды')}</div>`,ev,col(n))}

const EL={goal:'Гол',pen:'Пенальти',og:'Автогол',yc:'Жёлтая карточка',rc:'Красная карточка'},EI={goal:'ball',pen:'ball',og:'ball',yc:'card',rc:'card'};
const uq=a=>[...new Map(a.map(x=>[x.join('|'),x])).values()];
function openMatch(i,ev){const r=D.matches[i];if(!r)return;const x=res(r),pr=D.prot[r[10]]||{l:{},e:[],m:[],t:[]},meta=[];
 if(r[1])meta.push(ic('cal')+new Date(r[1]+'T12:00').toLocaleDateString('ru',{day:'numeric',month:'long',year:'numeric'})+(r[2]?', '+E(r[2]):''));else if(r[2])meta.push(ic('clock')+E(r[2]));
 if(r[13])meta.push(ic('pin')+E(r[13]));if(r[14])meta.push(ic('ref')+'Судьи: '+E(r[14]));
 const dn=D.divs.length>1&&r[11]?E(r[11])+' · ':'';
 const mk=(tm,n)=>{const e=pr.e.filter(q=>q[2]===tm&&q[3]===n),c=t=>e.filter(q=>q[1]===t).length,g=c('goal')+c('pen'),o=[];
  if(pr.m.some(q=>q[1]===n&&q[0]===tm))o.push(ic('star','star'));
  if(g)o.push(ic('ball','goal')+(g>1?'×'+g:''));if(c('og'))o.push(ic('ball','og'));if(c('yc'))o.push(ic('card','yc'));if(c('rc'))o.push(ic('card','rc'));return o.join('')};
 const evs=pr.e.map(([min,ty,tm,pl,xt],k)=>{const home=tm===r[3],sub=ty==='goal'&&xt?'пас: '+E(xt):EL[ty],cell=`<div class="ec ${home?'eh':'ea'}"><b>${E(pl)||'—'}</b><small>${sub}</small></div>`;
  return`<div class="ev" style="animation-delay:${.5+k*.05}s"><div>${home?cell:''}</div><div class="evm">${ic(EI[ty],ty)}<span>${E(min)}${min?'′':''}</span></div><div>${home?'':cell}</div></div>`}).join('');
 const lu=[r[3],r[6]].map(tm=>{const a=pr.l[tm]||[];return a.length?`<div><div class="lh">${bd(tm)}<span>${E(tm)}</span></div>${a.map(n=>{const z=(RS[tm]||[]).find(q=>q.n===n);return`<div class="lp"><i>${E(z?z.num:'')}</i><span>${E(n)}</span><em>${mk(tm,n)}</em></div>`}).join('')}</div>`:''}).join('');
 const mv=uq(pr.m);
 showSheet(X+`<div class="mh"><div class="kk">${dn}${E(r[12])} · ${E(tl(r[0]))}</div><div class="mx"><div class="tt" data-team="${E(r[3])}">${bd(r[3])}<span>${E(r[3])}</span></div><div class="sc">${x.p?r[4]+' : '+r[5]:'– : –'}${x.pen?`<small>пен. ${r[8]} : ${r[9]}</small>`:''}</div><div class="tt" data-team="${E(r[6])}">${bd(r[6])}<span>${E(r[6])}</span></div></div><div class="mi2">${meta.map(m=>`<span>${m}</span>`).join('')}</div></div>`+
 `<div class="pb">${mv.length?`<div class="mv">${ic('star','star')}<div><small>MVP матча</small>${mv.map(([tm,n])=>`<b>${E(n)}</b> <span>${E(tm)}</span>`).join(' · ')}</div></div>`:''}${evs?`<h4>События</h4><div class="tl2">${evs}</div>`:''}${lu?`<h4>Составы</h4><div class="lu">${lu}</div>`:''}${!evs&&!lu?empty('Протокол ещё не заполнен'):''}</div>`,ev,col(r[3]))}

function paintN(){const n=D.news;$('nw').innerHTML=n.length?n.map((x,i)=>`<article class="nc hv rv ${i==0?'big':''} ${x.p?'pin':''}" data-news="${i}" style="--i:${i%6}"><div class="im">${x.i?`<img src="${E(x.i)}" alt="" loading="lazy" onerror="this.remove()">`:''}${ic('news')}</div><div class="bd2"><time>${nd(x.d)}</time><h3>${E(x.t)}</h3><p>${E(x.x.replace(/\s+/g,' ').slice(0,220))}</p></div></article>`).join(''):empty('Новостей пока нет')}
function openNews(i,ev){const x=D.news[i];if(!x)return;
 showSheet(X+`<div class="mh nh"><div class="kk">${nd(x.d)}</div><h3 class="d">${E(x.t)}</h3></div><div class="pb art">${x.i?`<img class="ai" src="${E(x.i)}" alt="" onerror="this.remove()">`:''}${paras(x.x)}</div>`,ev)}

function main(d){D=d;['divs','stages','teams','tables','matches','news','rules','disq','scorers'].forEach(k=>D[k]=D[k]||[]);D.prot=D.prot||{};D.rosters=D.rosters||{};
 if(!D.divs.length)D.divs=[{n:'',d:''}];
 Object.keys(C).forEach(k=>delete C[k]);Object.keys(L).forEach(k=>delete L[k]);

/* ---------- данные и мгновенное обновление ---------- */
let last='';
function upd(d){ver=d.v||ver;const k=JSON.stringify({...d,updated:0,v:0});if(k===last)return;last=k;main(d)}
function fail(){if(!D)document.body.insertAdjacentHTML('beforeend','<div class="err" id="er">Не удалось загрузить данные.<br><button onclick="location.reload()">Повторить</button></div>')}
/* Данные приходят из веб-приложения Apps Script. Последний ответ хранится в браузере: при повторном заходе сайт рисуется мгновенно, свежие данные подтягиваются следом. */
const API=window.API_URL,CK='mlfl:last2',POLL=20000;
const store={get(){try{return localStorage.getItem(CK)}catch(e){return null}},set(v){try{localStorage.setItem(CK,v)}catch(e){}}};
async function req(q){const r=await fetch(API+'?api='+q,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return q==='v'?(await r.text()).trim():r.json()}
async function loadAll(){try{const d=await req(1);upd(d);store.set(JSON.stringify(d))}catch(e){fail()}}
async function pull(){if(document.hidden||!API)return;try{const v=await req('v');if(v&&v!==ver)await loadAll()}catch(e){}}
if(!API||/^ВСТАВЬТЕ/.test(API)){document.body.insertAdjacentHTML('beforeend','<div class="err">Укажите адрес веб-приложения Apps Script в начале index.html (window.API_URL).</div>')}
else{const c=store.get();if(c){try{upd(JSON.parse(c))}catch(e){}}loadAll();setInterval(pull,POLL);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});addEventListener('online',pull)}

 a=t.closest('[data-team]');if(a){openTeam(a.dataset.team,e);return}

onkeydown=e=>e.key=='Escape'&&closeT();

try{const s=localStorage.getItem('th');if(s)root.dataset.theme=s}catch(e){}
$('th').onclick=()=>{const n=root.dataset.theme=='light'?'dark':'light';root.dataset.theme=n;try{localStorage.setItem('th',n)}catch(e){}};
/* логотип статичен; раз в несколько секунд по нему пробегает блик (рисуется только по форме логотипа) */
(()=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const img=$('hlg'),cv=$('hlc'),ctx=cv.getContext('2d');
 function glint(){if(document.hidden||img.hidden||!img.complete||!img.naturalWidth||img.getBoundingClientRect().bottom<0)return;
  const dpr=devicePixelRatio||1,w=img.clientWidth,h=img.clientHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const k=Math.min(w/img.naturalWidth,h/img.naturalHeight),dw=img.naturalWidth*k,dh=img.naturalHeight*k,dx=(w-dw)/2,dy=(h-dh)/2,t0=performance.now();
  (function f(t){const q=Math.min(1,(t-t0)/1100),p=-.25+1.5*(q<.5?2*q*q:1-Math.pow(-2*q+2,2)/2);
   ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,w,h);ctx.drawImage(img,dx,dy,dw,dh);
   ctx.globalCompositeOperation='source-in';const g=ctx.createLinearGradient(w*(p-.16),0,w*(p+.16),h*.45);
   g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.85)');g.addColorStop(1,'rgba(255,255,255,0)');
   ctx.fillStyle=g;ctx.fillRect(0,0,w,h);if(q<1)requestAnimationFrame(f);else ctx.clearRect(0,0,w,h)})(t0)}
 setTimeout(function loop(){glint();setTimeout(loop,5500)},1500);
})();
/* цвет акцента плавно следует за курсором на фоне сайта */
(()=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const g=$('cur');let x=0,y=0,tx=0,ty=0,run=false;
 function f(){x+=(tx-x)*.12;y+=(ty-y)*.12;g.style.setProperty('--gx',x+'px');g.style.setProperty('--gy',y+'px');
  if(Math.abs(tx-x)+Math.abs(ty-y)>.5)requestAnimationFrame(f);else run=false}
 addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;if(!g.classList.contains('on')){x=tx;y=ty;g.classList.add('on')}if(!run){run=true;requestAnimationFrame(f)}},{passive:true});
 document.documentElement.addEventListener('pointerleave',()=>g.classList.remove('on'));
})();
const ht=$('ht'),hl=$('hl'),hero=document.querySelector('.hero');
addEventListener('scroll',()=>{const h=innerHeight*.8;if(scrollY>innerHeight*1.2)return;const p=Math.min(1,Math.max(0,scrollY/h));ht.style.transform=`translateY(${-p*30}px)`;ht.style.opacity=1-Math.max(0,(p-.55)*2.4)},{passive:true});
/* нижняя панель: активный раздел и «стеклянная» капсула под ним */
function spy(){const bar=$('bar'),pill=$('pill');if(!bar||!bar.offsetWidth)return;let a='table';
 for(const id of['table','games','stats','news','rules']){const e=$(id);if(e&&e.getBoundingClientRect().top<innerHeight*.5)a=id}
 if(innerHeight+scrollY>=document.documentElement.scrollHeight-6)a='rules';
 const l=bar.querySelector('[data-go="'+a+'"]');bar.querySelectorAll('a').forEach(x=>x.classList.toggle('on',x===l));
 if(l){pill.style.width=l.offsetWidth+'px';pill.style.transform='translateX('+l.offsetLeft+'px)';if(pill.classList.contains('init'))requestAnimationFrame(()=>requestAnimationFrame(()=>pill.classList.remove('init')))}}
addEventListener('scroll',spy,{passive:true});addEventListener('resize',spy);
</script></body></html>
